name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

  python-parity:
    name: python bindings ⇄ CLI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The parity test shells out to the `veridex` CLI and the make_demo_mcap example, so the
      # workspace binaries must exist before pytest runs.
      - name: Build the CLI
        run: cargo build -p veridex-cli

      - name: Build & install the extension (maturin)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.5,<2.0" pytest
          maturin develop -m crates/veridex-py/Cargo.toml

      - name: Run parity test
        run: |
          . .venv/bin/activate
          python -m pytest crates/veridex-py/tests/test_parity.py -q
