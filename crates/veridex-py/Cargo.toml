[package]
name = "veridex-py"
description = "Python bindings for Veridex (import module: veridex)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true


[lib]
name = "veridex"
crate-type = ["cdylib"]

[dependencies]
# Parity with the CLI: `veridex.check("hf://…", metadata_only=True)` must do what
# `veridex check hf://… --metadata-only` does, which needs the core's remote feature.
veridex-core = { path = "../veridex-core", version = "0.1.0", features = ["remote"] }
serde_json.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
