[package]
name = "veridex-core"
description = "Veridex core: the Canonical Dataset Model, validation engine, and trust-certificate substrate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
# Test fixtures are 2.3 MiB of binary Zarr/HDF5 stores that only this repo's tests read. They stay in
# git and out of the published crate, which downstream users compile rather than test.
exclude = ["tests/fixtures/**"]


[dependencies]
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
mcap = "0.25"
ed25519-dalek = "2"
getrandom = "0.2"
parquet = "59"
arrow = "59"
toml = "0.8"
flate2 = "1"
zstd = "0.13"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
arrow = "59"
parquet = "59"
serde_json.workspace = true
