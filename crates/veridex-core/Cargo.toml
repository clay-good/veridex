[package]
name = "veridex-core"
description = "Veridex core: the Canonical Dataset Model, validation engine, and trust-certificate substrate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
# Test fixtures are 2.3 MiB of binary Zarr/HDF5 stores that only this repo's tests read. They stay in
# git and out of the published crate, which downstream users compile rather than test.
exclude = ["tests/fixtures/**"]


[dependencies]
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
mcap = "0.25"
ed25519-dalek = "2"
getrandom = "0.2"
parquet = "59"
arrow = "59"
toml = "0.8"
flate2 = "1"
zstd = "0.13"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }
# Only the remote manifest read (`hf://…` with `--metadata-only`) uses these, so they sit behind the
# `remote` feature: a library user embedding the core does not compile a TLS stack to validate a
# local dataset, and nothing else in the crate acquires a network dependency.
ureq = { version = "3", optional = true }
tempfile = { version = "3", optional = true }

# docs.rs should document the remote reader, which is off by default.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Read a dataset's manifest from the Hugging Face Hub. See `src/remote.rs`.
remote = ["dep:ureq", "dep:tempfile"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# The MF4 fixtures build real `##DZ` blocks, which means really deflating their records.
flate2 = "1"
# The demo dataset generators, called directly. They used to be `examples/` here, which meant a test
# could only build one by spawning `cargo run --example` — and several test binaries doing that at
# once contend on the build lock and make the suite fail in unrelated places.
veridex-demo = { path = "../veridex-demo" }
arrow = "59"
parquet = "59"
serde_json.workspace = true
