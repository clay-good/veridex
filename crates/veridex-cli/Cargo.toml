[package]
name = "veridex-cli"
description = "The `veridex` command-line interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"


[[bin]]
name = "veridex"
path = "src/main.rs"

[dependencies]
# The binary people run is the one that should be able to read a Hub manifest, so the CLI turns the
# core's `remote` feature on. A library user embedding `veridex-core` still gets no TLS stack unless
# they ask for one.
veridex-core = { path = "../veridex-core", version = "0.1.0", features = ["remote"] }
serde_json.workspace = true

# Only to put SIGPIPE back to its default disposition, which Rust's runtime turns off. Already in
# the tree transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
