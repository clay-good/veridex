[package]
name = "veridex-cli"
description = "The `veridex` command-line interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "veridex"
path = "src/main.rs"

[dependencies]
veridex-core = { path = "../veridex-core" }
serde_json.workspace = true

# Only to put SIGPIPE back to its default disposition, which Rust's runtime turns off. Already in
# the tree transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
