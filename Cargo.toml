[workspace]
resolver = "2"
members = [
    "crates/veridex-core",
    "crates/veridex-demo",
    "crates/veridex-cli",
    "crates/veridex-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/clay-good/veridex"
homepage = "https://github.com/clay-good/veridex"
documentation = "https://docs.rs/veridex-core"
keywords = ["robotics", "dataset", "validation", "provenance", "data-quality"]
categories = ["science::robotics", "development-tools::testing", "command-line-utilities"]
rust-version = "1.74"

[workspace.dependencies]
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
